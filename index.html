<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Task Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-md">
      <div class="max-w-2xl mx-auto px-4 py-6">
        <h1 class="text-2xl font-bold tracking-tight">📚 Study Task Planner</h1>
        <p class="text-blue-200 text-sm mt-1">
          Keep track of your assignments, deadlines, and progress — all in one place.
        </p>
      </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8 space-y-6">

      <!-- Assignment Creation Form -->
      <section aria-labelledby="form-heading" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <h2 id="form-heading" class="text-base font-semibold text-slate-700 mb-4">Add New Assignment</h2>
        <form id="task-form" novalidate>
          <div class="space-y-4">

            <div>
              <label for="task-title" class="block text-sm font-medium text-slate-600 mb-1">
                Assignment Title <span class="text-red-500" aria-hidden="true">*</span>
              </label>
              <input
                id="task-title"
                type="text"
                autocomplete="off"
                placeholder="e.g. Write Chapter 3 essay"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                aria-required="true"
                aria-describedby="title-error"
              />
              <p id="title-error" class="hidden mt-1 text-xs text-red-600" role="alert"></p>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">
                Due Date <span class="text-red-500" aria-hidden="true">*</span>
                <span class="text-xs font-normal text-slate-400 ml-1">(DD / MM / YYYY)</span>
              </label>
              <div class="flex items-center gap-1" role="group" aria-label="Due date" aria-describedby="due-error">
                <input
                  id="task-due-dd"
                  type="number"
                  min="1" max="31"
                  placeholder="DD"
                  class="w-16 rounded-lg border border-slate-300 px-2 py-2 text-sm text-slate-800 text-center placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  aria-label="Day"
                  aria-required="true"
                />
                <span class="text-slate-400 font-medium">/</span>
                <input
                  id="task-due-mm"
                  type="number"
                  min="1" max="12"
                  placeholder="MM"
                  class="w-16 rounded-lg border border-slate-300 px-2 py-2 text-sm text-slate-800 text-center placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  aria-label="Month"
                  aria-required="true"
                />
                <span class="text-slate-400 font-medium">/</span>
                <input
                  id="task-due-yyyy"
                  type="number"
                  min="2000" max="2100"
                  placeholder="YYYY"
                  class="w-24 rounded-lg border border-slate-300 px-2 py-2 text-sm text-slate-800 text-center placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  aria-label="Year"
                  aria-required="true"
                />
              </div>
              <p id="due-error" class="hidden mt-1 text-xs text-red-600" role="alert"></p>
            </div>

          </div>
          <button
            type="submit"
            class="mt-5 w-full bg-blue-700 hover:bg-blue-800 active:bg-blue-900 text-white text-sm font-semibold py-2.5 rounded-lg transition-colors"
          >
            Add Assignment
          </button>
        </form>
      </section>

      <!-- Filter Tabs -->
      <section aria-label="Filter assignments">
        <div class="flex gap-2" role="tablist" aria-label="Assignment filters">
          <button role="tab" aria-selected="true"  data-filter="all"       class="filter-tab tab-active">All</button>
          <button role="tab" aria-selected="false" data-filter="active"    class="filter-tab">Active</button>
          <button role="tab" aria-selected="false" data-filter="completed" class="filter-tab">Completed</button>
        </div>
      </section>

      <!-- Assignment List -->
      <section aria-label="Assignment list">
        <ul id="task-list" class="space-y-3" aria-live="polite" aria-relevant="additions removals">
          <!-- Tasks injected by script.js -->
        </ul>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-14 text-slate-400">
          <p class="text-4xl mb-3" aria-hidden="true">📋</p>
          <p id="empty-message" class="text-sm font-medium">No assignments yet. Add one above to get started.</p>
        </div>
      </section>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-400 py-6 border-t border-slate-200 mt-4">
      Study Task Planner &mdash; IBM SkillsBuild Capstone Project
    </footer>

    <script src="script.js"></script>
  </body>
</html>
